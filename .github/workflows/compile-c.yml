name: C compile and smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-all:
    name: Compile all C examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Compile each C source file
        run: make check

  smoke-tests:
    name: Run targeted smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run representative algorithm smoke tests
        run: make test

  sanitizer-tests:
    name: Run address and undefined-behavior sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run sanitizer checks on edge-case tests
        run: make sanitize
